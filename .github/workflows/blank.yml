# Nome da Actions:
name: Snake Game

# Controlador do tempo que sera feito a atualização dos arquivos.
on:
  schedule:
      # Será atualizado a cada 5 horas.
    - cron: "0 */5 * * *"

# Permite executar na lista de Actions (utilizado para testes de build).
  workflow_dispatch:

# Permissão necessária para publicar na branch de output.
permissions:
  contents: write

# Regras
jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    # Gera os arquivos da cobrinha.
    # v3 busca as contribuicoes pela API oficial do GitHub (precisa do token).
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: MatheusCarvalho12 #Seu usuario
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # O .svg ja traz o tema claro/escuro embutido (media query interna).
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.gif

    # Publica os arquivos gerados na branch "output".
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          # the output branch we mentioned above
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
