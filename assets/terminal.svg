<svg xmlns="http://www.w3.org/2000/svg" width="860" height="212" viewBox="0 0 860 212" role="img" aria-label="Terminal: whoami --stack">
<style>
  .win{fill:#0d1117;stroke:#30363d;stroke-width:1}
  .bar{fill:#161b22}
  .ttl{fill:#7d8590;font:600 12px ui-monospace,'SF Mono',Menlo,Consolas,monospace}
  .m{font:15px ui-monospace,'SF Mono',Menlo,Consolas,monospace}
  .pr{fill:#2196f3}.cmd{fill:#e6edf3}.ou{fill:#8b949e}.ok{fill:#3fb950}
  /* visivel por padrao: a animacao (fill-mode backwards) so esconde ANTES
     da vez. Se o renderizador ignorar animacao, tudo aparece mesmo assim. */
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .l{animation:rise .35s ease-out backwards}
  .l1{animation-delay:.5s}.l2{animation-delay:1.5s}.l3{animation-delay:1.9s}
  .l4{animation-delay:2.3s}.l5{animation-delay:3.1s}.l6{animation-delay:4.0s}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .cur{fill:#2196f3;animation:blink 1.06s step-end infinite 4.3s backwards}
</style>
  <rect class="win" x=".5" y=".5" width="859" height="211" rx="10"/>
  <path class="bar" d="M.5 10.5A10 10 0 0 1 10.5.5h839a10 10 0 0 1 10 10V38H.5z"/>
  <circle cx="20" cy="19.5" r="5.5" fill="#ff5f57"/>
  <circle cx="39" cy="19.5" r="5.5" fill="#febc2e"/>
  <circle cx="58" cy="19.5" r="5.5" fill="#28c840"/>
  <text class="ttl" x="430" y="24" text-anchor="middle">matheus@dev — zsh</text>
  <g class="m">
    <text class="l l1" x="24" y="72"><tspan class="pr">➜</tspan><tspan class="cmd" dx="10">whoami --stack</tspan></text>
    <text class="l l2" x="24" y="100"><tspan class="ou">Matheus Carvalho · Backend Engineer</tspan></text>
    <text class="l l3" x="24" y="124"><tspan class="ou">.NET · Python · Clean Architecture · DDD · CQRS</tspan></text>
    <text class="l l4" x="24" y="148"><tspan class="ou">Event-Driven · Microservices · Kafka · RabbitMQ</tspan></text>
    <text class="l l5" x="24" y="180"><tspan class="pr">➜</tspan><tspan class="cmd" dx="10">status</tspan></text>
    <g class="l l6">
      <text x="118" y="180"><tspan class="ok">●</tspan><tspan class="ou" dx="8">building · shipping · learning</tspan></text>
      <rect class="cur" x="414" y="168" width="8" height="14"/>
    </g>
  </g>
</svg>
